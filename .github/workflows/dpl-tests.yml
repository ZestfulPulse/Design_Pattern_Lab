name: DPL verification tests

on:
  push:
    paths:
      - "tools/dpl/**"
      - "skills/design-team/schemas/**"
      - "skills/design-team/patterns/**"
      - "skills/design-team/templates/**"
      - ".github/workflows/dpl-tests.yml"
  pull_request:
    paths:
      - "tools/dpl/**"
      - "skills/design-team/schemas/**"
      - "skills/design-team/patterns/**"
      - "skills/design-team/templates/**"
      - ".github/workflows/dpl-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verifier dependencies
        run: python -m pip install -r tools/dpl/requirements.txt
      - name: Run DPL verifier tests
        working-directory: tools/dpl
        run: python -m unittest discover -p 'test_*.py'
