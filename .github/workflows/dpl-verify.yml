name: DPL Verification (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/dpl/**'
      - 'skills/design-team/**'
      - '.github/workflows/dpl-verify.yml'
permissions:
  contents: read
jobs:
  dpl-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free verification dependency
        run: python -m pip install -r tools/dpl/requirements.txt
      - name: Run DPL contract tests
        working-directory: tools/dpl
        run: python -m unittest -v test_dpl
      - name: Confirm design skill entry point
        run: |
          test -s skills/design-team/SKILL.md
          test -s tools/dpl/verdict_gate.py
          test -s tools/dpl/checks_runner.py
          echo "DPL skill and structured verifier available."
      - name: Verification scope
        run: |
          echo "This workflow validates DPL's deterministic verification tools."
          echo "It does NOT launch Codex, generate design, capture a browser, or deploy."
